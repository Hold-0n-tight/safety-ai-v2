dataset:
  name: pathmnist
  root: data/medmnist
  size: 28                      # tiny download; transform resizes to model input
  split:
    type: dirichlet
    alpha: 10.0                 # close to IID — smoke tests the pipeline,
    num_clients: 2              #   8GB RAM Mac variant (2 clients)
    seed: 42
    cache: true
