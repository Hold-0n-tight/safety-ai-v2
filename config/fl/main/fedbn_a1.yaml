model:
  name: efficientnet_b0
  output_dim: 9
train:
  strategy: fedbn
  rounds: 25
  local_epochs: 5
  batch_size: 64
  lr: 0.001
  optimizer: adam
fl:
  fraction_fit: 1.0
  min_fit_clients: 5
  min_available_clients: 5
  client_resources:
    num_cpus: 1
    num_gpus: 0.2
dataset:
  name: pathmnist
  root: data/medmnist
  size: 64
  split_path: data/split/pathmnist_dirichlet_alpha1.json
