model:
  name: efficientnet_b0
  output_dim: 9

train:
  strategy: fedavg
  rounds: 2                     # smoke: just verify round transitions
  local_epochs: 1
  batch_size: 64
  lr: 0.001
  optimizer: adam

fl:
  fraction_fit: 1.0
  min_fit_clients: 5
  min_available_clients: 5

dataset:
  name: pathmnist
  root: data/medmnist
  size: 28
  split_path: data/split/smoke.json
